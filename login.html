<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Member Login | Coding Club, NFSU Tripura</title>
    <link rel="stylesheet" href="./style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        .login-card {
            max-width: 420px;
            margin: 0 auto;
            padding: 2rem;
            background: rgba(0, 0, 0, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            backdrop-filter: blur(8px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
        }
        .login-card h3 {
            margin: 0 0 1rem 0;
            font-weight: 700;
        }
        .login-field {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin-bottom: 1rem;
            text-align: left;
        }
        .login-field label {
            font-size: 0.9rem;
            color: #cfcfcf;
        }
        .login-field input {
            padding: 0.75rem 0.9rem;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            outline: none;
        }
        .login-field input:focus {
            border-color: rgba(255, 0, 0, 0.7);
            box-shadow: 0 0 0 2px rgba(255, 0, 0, 0.2);
        }
        .login-actions {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
            justify-content: center;
        }
        .status {
            margin-top: 1rem;
            font-size: 0.9rem;
            color: #a9e3ff;
        }
        .status.error {
            color: #ff9ea0;
        }
        .small-note {
            margin-top: 1rem;
            font-size: 0.8rem;
            color: #bdbdbd;
        }
    </style>
</head>
<body>
    <div>
        <video autoplay loop muted playsinline id="bgvideo"><source src="/assests/video/bg1.mp4" type="video/mp4"></video>
    </div>
    <section>
        <nav class="navbar">
            <div class="nav-container">
                <div class="logo">
                    <img src="./assests/image/logo.png" alt="Coding Club Logo">
                </div>
                <ul class="nav-menu">
                    <li><a href="./index.html">Home</a></li>
                    <li><a href="./events.html">Events</a></li>
                    <li><a href="./members.html">Members</a></li>
                    <li><a href="./underdev.html">FAQs</a></li>
                    <li><a href="./underdev.html">Join Us</a></li>
                    <li><a href="./underdev.html">Links</a></li>
                    <li><a href="./login.html" class="active">Login</a></li>
                </ul>
            </div>
        </nav>
        <header class="hero">
            <div class="landpage">
                <h1><strong>Member <span class="red-text">Login</span></strong></h1>
                <h2>Access the club dashboard</h2>

                <div class="login-card">
                    <h3>Sign in with Supabase</h3>
                    <div class="login-field">
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="you@club.com" autocomplete="email" />
                    </div>
                    <div class="login-field">
                        <label for="password">Password</label>
                        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" />
                    </div>
                    <div class="login-actions">
                        <button class="btn" id="signInBtn" type="button">Sign In</button>
                        <button class="btn outline" id="signUpBtn" type="button">Sign Up</button>
                        <button class="btn outline" id="signOutBtn" type="button">Sign Out</button>
                    </div>
                    <div id="status" class="status">Not signed in.</div>
                    <div class="small-note">Ask the admin for an invite if sign-up is disabled.</div>
                </div>

                <a class="join-link" href="./index.html">← Back to Home</a>
            </div>
        </header>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const emailInput = document.getElementById("email");
        const passwordInput = document.getElementById("password");
        const statusEl = document.getElementById("status");

        let supabaseClient = null;

        const setStatus = (message, isError = false) => {
            statusEl.textContent = message;
            statusEl.classList.toggle("error", isError);
        };

        const getEnv = async () => {
            const response = await fetch("/api/env", { cache: "no-store" });
            if (!response.ok) {
                throw new Error("Unable to load environment variables.");
            }
            return response.json();
        };

        const initSupabase = async () => {
            setStatus("Loading auth settings...");
            const { supabaseUrl, supabaseAnonKey } = await getEnv();

            if (!supabaseUrl || !supabaseAnonKey) {
                throw new Error("Missing Supabase env vars on Vercel.");
            }

            supabaseClient = window.supabase.createClient(supabaseUrl, supabaseAnonKey);
            await refreshSession();
        };

        const refreshSession = async () => {
            if (!supabaseClient) {
                return;
            }

            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session?.user?.email) {
                setStatus(`Signed in as ${session.user.email}`);
            } else {
                setStatus("Not signed in.");
            }
        };

        document.getElementById("signInBtn").addEventListener("click", async () => {
            if (!supabaseClient) {
                setStatus("Supabase is not initialized yet.", true);
                return;
            }

            setStatus("Signing in...");
            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: emailInput.value,
                password: passwordInput.value
            });

            if (error) {
                setStatus(error.message, true);
                return;
            }

            if (data?.user?.email) {
                setStatus(`Signed in as ${data.user.email}`);
            } else {
                await refreshSession();
            }
        });

        document.getElementById("signUpBtn").addEventListener("click", async () => {
            if (!supabaseClient) {
                setStatus("Supabase is not initialized yet.", true);
                return;
            }

            setStatus("Creating account...");
            const { data, error } = await supabaseClient.auth.signUp({
                email: emailInput.value,
                password: passwordInput.value
            });

            if (error) {
                setStatus(error.message, true);
                return;
            }

            if (data?.user?.email) {
                setStatus(`Signup complete for ${data.user.email}. Check your email to verify.`);
            } else {
                setStatus("Signup requested. Check your email to verify.");
            }
        });

        document.getElementById("signOutBtn").addEventListener("click", async () => {
            if (!supabaseClient) {
                setStatus("Supabase is not initialized yet.", true);
                return;
            }

            const { error } = await supabaseClient.auth.signOut();
            if (error) {
                setStatus(error.message, true);
                return;
            }
            setStatus("Signed out.");
        });

        initSupabase().catch((error) => {
            setStatus(error.message, true);
        });
    </script>
</body>
</html>
