<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="./assests/image/logo.png">
  <title>Under Development</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #1a1a1a, #2d2d2d);
      font-family: Arial, sans-serif;
      color: #fff;
      text-align: center;
    }
    body.paper-page {
      background-color: #eee7da;
      background-image:
        radial-gradient(rgba(96, 72, 45, 0.08) 0.7px, transparent 0.7px),
        linear-gradient(135deg, rgba(255, 255, 255, 0.55), rgba(214, 201, 181, 0.28));
      background-size: 7px 7px, 100% 100%;
      background-attachment: fixed;
    }
    .container {
      max-width: 600px;
      padding: 2rem;
    }
    h1 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
      color: #ff4444;
    }
    p {
      font-size: 1.2rem;
      color: #ccc;
    }
    .back-link {
      margin-top: 2rem;
      display: inline-block;
      padding: 0.8rem 1.5rem;
      background: #ff4444;
      color: #fff;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
      transition: background 0.3s ease;
    }
    .back-link:hover {
      background: #cc0000;
    }
  </style>
</head>
<body class="paper-page">
  <div class="container">
    <h1>Under Development </h1>
    <p>This page is currently being built. Please check back later!</p>
    <a href="./index.html" class="back-link">← Back to Home</a>
